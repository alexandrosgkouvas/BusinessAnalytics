<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thank You</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
    background: linear-gradient(120deg, #89f7fe 0%, #66a6ff 100%);
    background-attachment: fixed;
    background-size: cover;
    font-family: 'Segoe UI', sans-serif;
  }

    .thank-you-container {
      background: linear-gradient(to bottom, #007bff, #00d2d2);
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
      color: white;
      max-width: 800px;
      margin: 0 auto;
      text-align: center;
      animation: fadeIn 1.2s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .thank-you-container h1 {
      font-size: 3rem;
      margin-bottom: 20px;
    }

    .thank-you-container p {
      font-size: 1.2rem;
      margin-bottom: 30px;
    }

    .thank-you-container button {
      background-color: #28a745;
      border: none;
      padding: 10px 20px;
      color: white;
      font-size: 1.1rem;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    .thank-you-container button:hover {
      background-color: #218838;
    }

    .acknowledgments {
      margin-top: 40px;
      font-size: 0.95rem;
    }

    .ack-column {
      text-align: left;
    }

    .ack-column h5 {
      font-size: 1.1rem;
      font-weight: bold;
    }

    .ack-column p {
      margin: 4px 0;
    }

    .additional-info {
      margin-top: 20px;
      font-size: 1.1rem;
      color: #333;
    }
  </style>
</head>
<body>

  <div class="thank-you-container">
      <img src="{{ url_for('static', filename='images/med.jpg') }}" alt="College Logo" class="img-fluid mb-4" style="max-width: 200px;">


    <h1>Thank You!</h1>
    <p>Your sampled file has been successfully downloaded.</p>
    <button onclick="window.location.href='/'">Go Back Now</button>

    <!-- Acknowledgments Section -->
    <div class="acknowledgments mt-5">
      <div class="row">
        <div class="col-md-6 ack-column">
          <h5>Special Thanks</h5>
          <p>To our professor Mr Rompas for guidance and support</p>
          <p>during the Business Analytics module</p>
          <p>at Mediterranean College</p>
        </div>
        <div class="col-md-6 ack-column">
          <h5>Developed By</h5>
          <p>Roxanne Avero</p>
          <p>Oikonomou Panagiotis</p>
          <p>Gkouvas Alexandros</p>
        </div>
      </div>
    </div>

    <!-- Additional Information Section (Academic Year) -->
    <div class="additional-info">
      <p>Academic Year: <strong>2024/2025</strong></p>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>

</body>
</html>
