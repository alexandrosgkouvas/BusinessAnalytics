<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sampling Required</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
  body {
    background: linear-gradient(120deg, #89f7fe 0%, #66a6ff 100%);
    background-attachment: fixed;
    background-size: cover;
    font-family: 'Segoe UI', sans-serif;
  }
/* Position the logo in the top-right corner */
    .logo {
      position: fixed;
      top: 10px;
      right: 10px;
      width: 100px; /* Adjust the size of the logo */
    }
  </style>
</head>
<body class="bg-light py- 5">

  <!-- Logo in the top-right corner -->
  <img src="{{ url_for('static', filename='images/mc.jpg') }}" alt="Logo" class="logo">
  <div class="container py-5">
    <div class="card shadow-lg">
      <div class="card-body">
        <h2 class="card-title text-danger mb-4">
          ⚠️ File Too Large: {{ row_count }} Rows Detected
        </h2>
        <p class="mb-4">
          SAS OnDemand for Academics supports a maximum of <strong>50,000 rows</strong>.
        </p>

        <form method="POST" action="/sample">
          <input type="hidden" name="filename" value="{{ filename }}">
          <input type="hidden" name="file_type" value="{{ file_type }}">

          <div class="mb-3">
            <label for="sample_size" class="form-label">Enter number of rows to sample (max 50,000):</label>
            <input type="number" class="form-control" name="sample_size" id="sample_size" max="50000" min="1" required>
          </div>

          <div class="d-grid gap-2">
            <button type="submit" class="btn btn-success">Create Sample</button>
            <a href="/" class="btn btn-secondary">⬅️ Back to Upload Page</a>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
