<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Data Preview</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(120deg, #89f7fe 0%, #66a6ff 100%);
            background-attachment: fixed;
            background-size: cover;
            font-family: 'Segoe UI', sans-serif;
        }

        /* Position the logo in the top-right corner */
        .logo {
            position: fixed;
            top: 10px;
            right: 10px;
            width: 100px; /* Adjust the size of the logo */
        }

        /* Glassmorphism effect for the card containers */
        .card-body {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border-radius: 10px;
        }

        /* Style the download and back button container */
        .button-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin-top: 40px;
        }

        .btn-custom {
            width: 100%;
            max-width: 400px;
            padding: 15px;
            border-radius: 10px;
        }

        .btn-success {
            background-color: #28a745; /* Green */
            border-color: #28a745;
        }

        .btn-secondary {
            background-color: #6c757d; /* Gray */
            border-color: #6c757d;
        }
    </style>
</head>
<body class="bg-light">

    <!-- Logo in the top-right corner -->
    <img src="{{ url_for('static', filename='images/mc.jpg') }}" alt="Logo" class="logo">

    <div class="container">
        <h1 class="text-primary mb-4">Dataset Summary</h1>

        <!-- Dataset Overview Section -->
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <h2 class="card-title text-secondary">🔍 Dataset Overview</h2>
                <p><strong>Shape:</strong> {{ shape[0] }} rows × {{ shape[1] }} columns</p>
                <h3>Column Types:</h3>
                <pre>{{ dtypes|safe }}</pre>
            </div>
        </div>

        <!-- Sample Preview Section -->
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <h2 class="card-title text-secondary">📊 Sample Preview (First 10 Rows)</h2>
                <pre>{{ preview|safe }}</pre>
            </div>
        </div>

        <!-- Download and Redirect Buttons -->
        <div class="button-container">
            <!-- Green Download Button -->
            <form action="{{ url_for('start_download') }}" method="post" class="mb-3">
                <input type="hidden" name="filename" value="{{ download_file }}">
                <button type="submit" class="btn btn-success btn-lg btn-custom">⬇️ Download File</button>
            </form>

            <!-- Gray Back Button -->
            <a href="/" class="btn btn-secondary btn-lg btn-custom">⬅️ Back to Upload Page</a>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
